<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#g)"/>
  <rect width="800" height="400" fill="url(#grid)"/>
  <text x="400" y="190" font-family="Arial Black, sans-serif" font-size="80" font-weight="900"
        fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Claude Skills</text>
  <text x="400" y="260" font-family="Arial, sans-serif" font-size="36" font-weight="600"
